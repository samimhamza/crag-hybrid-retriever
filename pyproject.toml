[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crag-hybrid-retriever"
version = "0.1.0"
description = "Production-grade Corrective RAG (CRAG) & Hybrid Retrieval engine combining BM25, Dense Vector Search, Reciprocal Rank Fusion, and Cross-Encoder Reranking."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ahmad Samim Hamza" }
]
urls = { Repository = "https://github.com/samimhamza/crag-hybrid-retriever" }
keywords = [
    "rag",
    "crag",
    "retrieval-augmented-generation",
    "hybrid-search",
    "reciprocal-rank-fusion",
    "bm25",
    "vector-search",
    "reranking",
    "flashrank",
    "evaluator"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "pydantic>=2.4.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.24.0",
    "flashrank>=0.2.0",
]

[project.optional-dependencies]
dense = [
    "sentence-transformers>=2.5.0",
    "qdrant-client>=1.9.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crag_retriever"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "flashrank.*",
    "rank_bm25.*",
]
ignore_missing_imports = true

